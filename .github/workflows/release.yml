name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate release version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ ! "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '${tag}' is not a supported semantic version." >&2
            exit 1
          fi

          if [[ "${tag}" != "${manifest_version}" ]]; then
            echo "Release tag '${tag}' does not match manifest.json version '${manifest_version}'." >&2
            exit 1
          fi

          if [[ "${package_version}" != "${manifest_version}" ]]; then
            echo "package.json version '${package_version}' does not match manifest.json version '${manifest_version}'." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify and build plugin
        run: npm run verify

      - name: Validate release assets
        shell: bash
        run: |
          for asset in main.js manifest.json styles.css; do
            if [[ ! -s "${asset}" ]]; then
              echo "Required release asset '${asset}' is missing or empty." >&2
              exit 1
            fi
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          main.js manifest.json styles.css
          --verify-tag
          --generate-notes
          --title "Homepage Studio ${GITHUB_REF_NAME}"
