name: Release

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(node -p "require('./manifest.json').version")"

            if ! git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "No '${tag}' tag exists yet; skipping release recovery."
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            git checkout --detach "refs/tags/${tag}"
          fi

          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ ! "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '${tag}' is not a supported semantic version." >&2
            exit 1
          fi

          if [[ "${tag}" != "${manifest_version}" ]]; then
            echo "Release tag '${tag}' does not match manifest.json version '${manifest_version}'." >&2
            exit 1
          fi

          if [[ "${package_version}" != "${manifest_version}" ]]; then
            echo "package.json version '${package_version}' does not match manifest.json version '${manifest_version}'." >&2
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release '${tag}' already exists; skipping duplicate publication."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "publish=true" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci

      - name: Verify and build plugin
        if: steps.release.outputs.publish == 'true'
        run: npm run verify

      - name: Validate release assets
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          for asset in main.js manifest.json styles.css; do
            if [[ ! -s "${asset}" ]]; then
              echo "Required release asset '${asset}' is missing or empty." >&2
              exit 1
            fi
          done

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.release.outputs.tag }}"
          main.js manifest.json styles.css
          --verify-tag
          --generate-notes
          --title "Homepage Studio ${{ steps.release.outputs.tag }}"
